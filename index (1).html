<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GHISA — Diario di Allenamento</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1C1B19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GHISA">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1B19;
    --surface:#252320;
    --surface-raised:#302D27;
    --ink:#ECE7DD;
    --ink-muted:#948C7C;
    --ink-faint:#5E594E;
    --rust:#C1421A;
    --rust-dim:#8C3216;
    --olive:#7C8A5E;
    --olive-dim:#5C6746;
    --steel:#5C7A8A;
    --steel-dim:#456070;
    --success:#7FA37A;
    --line:#3A362F;
    --danger:#B5462E;
    --font-display:'Oswald',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:880px;margin:0 auto;padding:0 20px 80px;}
  .topbar{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:32px 0 20px;border-bottom:2px solid var(--line);
  }
  .wordmark{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:1px;color:var(--ink);margin:0;}
  .wordmark span{color:var(--rust);}
  .subtitle{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:2px;margin:2px 0 0;}
  .date-stamp{
    font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);
    border:1px dashed var(--ink-faint);padding:6px 12px;transform:rotate(-2deg);
    white-space:nowrap;
  }
  .daily-quote{
    font-family:var(--font-mono);font-size:13px;color:var(--ink);
    border-left:3px solid var(--rust);padding:10px 14px;margin:18px 0 0;
    background:var(--surface);font-style:normal;line-height:1.5;
  }
  .daily-quote::before{content:"“";color:var(--rust);font-family:var(--font-display);font-size:16px;margin-right:2px;}
  nav.tabs{display:flex;gap:6px;margin:24px 0 28px;flex-wrap:wrap;}
  nav.tabs button{
    font-family:var(--font-display);font-size:14px;letter-spacing:0.5px;
    background:var(--surface);color:var(--ink-muted);border:1px solid var(--line);
    padding:10px 18px;cursor:pointer;text-transform:uppercase;transition:all .15s;
  }
  nav.tabs button:hover{color:var(--ink);border-color:var(--ink-faint);}
  nav.tabs button.active{background:var(--rust);color:#F6EFE7;border-color:var(--rust);}
  .panel{display:none;}
  .panel.active{display:block;}
  h2.section-title{
    font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:0.5px;
    margin:0 0 4px;text-transform:uppercase;
  }
  p.section-hint{font-size:13px;color:var(--ink-muted);margin:0 0 20px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:2px;
    padding:18px 20px;margin-bottom:14px;position:relative;
  }
  .btn{
    font-family:var(--font-display);font-size:13px;letter-spacing:0.5px;text-transform:uppercase;
    background:var(--surface-raised);color:var(--ink);border:1px solid var(--ink-faint);
    padding:9px 16px;cursor:pointer;transition:all .15s;
  }
  .btn:hover{border-color:var(--rust);color:var(--rust);}
  .btn-primary{background:var(--rust);color:#F6EFE7;border-color:var(--rust);}
  .btn-primary:hover{background:var(--rust-dim);color:#F6EFE7;}
  .btn-olive{background:var(--olive);color:#1C1B19;border-color:var(--olive);}
  .btn-olive:hover{background:var(--olive-dim);color:#F6EFE7;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-muted);padding:6px 10px;}
  .btn-ghost:hover{color:var(--danger);border-color:transparent;}
  .btn-sm{padding:6px 12px;font-size:11px;}
  input,textarea,select{
    font-family:var(--font-mono);font-size:13px;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);padding:8px 10px;border-radius:2px;width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rust);}
  label.field-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-muted);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;}
  .row > .field{flex:1;}
  .divider{border:none;border-top:1px solid var(--line);margin:16px 0;}
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-muted);
    border:1px dashed var(--ink-faint);font-size:13px;
  }
  .empty-state .btn{margin-top:14px;}
  .stamp{
    display:inline-block;font-family:var(--font-mono);font-weight:700;font-size:10px;
    color:var(--rust);border:2px solid var(--rust);padding:2px 7px;transform:rotate(-6deg);
    letter-spacing:1px;margin-left:8px;
  }
  .log-entry{position:relative;}
  .log-entry .date-badge{
    font-family:var(--font-mono);font-size:11px;color:var(--bg);background:var(--ink);
    display:inline-block;padding:3px 10px;transform:rotate(-1.5deg);font-weight:700;
    letter-spacing:0.5px;margin-bottom:10px;
  }
  .log-entry .meta{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);margin-bottom:10px;}
  .exercise-block{padding:10px 0;border-top:1px solid var(--line);}
  .exercise-block:first-of-type{border-top:none;}
  .exercise-name{font-family:var(--font-display);font-size:15px;letter-spacing:0.3px;margin-bottom:6px;}
  .set-row{
    display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:13px;
    color:var(--ink-muted);padding:3px 0;
  }
  .set-row .set-idx{color:var(--ink-faint);width:18px;}
  .set-row .set-val{color:var(--ink);}
  .card-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;}
  .add-set-row,.add-item-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;}
  .add-set-row .field,.add-item-row .field{margin-bottom:0;}
  .exercise-form-block{border:1px solid var(--line);padding:12px;margin-bottom:10px;background:var(--bg);}
  .day-tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;}
  .day-tabs button{
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    background:var(--surface);color:var(--ink-muted);border:1px solid var(--line);
    padding:8px 14px;cursor:pointer;white-space:nowrap;
  }
  .day-tabs button.active{background:var(--olive);color:#1C1B19;border-color:var(--olive);}
  .plan-row,.diet-item-row{
    display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);
    font-family:var(--font-mono);font-size:13px;
  }
  .plan-row:last-child,.diet-item-row:last-child{border-bottom:none;}
  .plan-row .name,.diet-item-row .name{flex:2;color:var(--ink);}
  .plan-row .detail,.diet-item-row .detail{flex:1;color:var(--ink-muted);text-align:right;}
  .meal-slot{margin-bottom:20px;}
  .meal-slot-header{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--font-display);font-size:15px;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--olive);margin-bottom:8px;border-bottom:1px solid var(--olive-dim);padding-bottom:6px;
  }
  .meal-slot-header .kcal-total{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);}
  .day-total{
    text-align:right;font-family:var(--font-mono);font-size:13px;color:var(--ink);
    margin-top:10px;padding-top:10px;border-top:2px solid var(--line);
  }
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);padding:14px 16px;}
  .stat-card .label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-muted);margin-bottom:6px;}
  .stat-card .value{font-family:var(--font-display);font-size:26px;color:var(--ink);}
  .stat-card .value.up{color:var(--success);}
  .stat-card .value.down{color:var(--rust);}
  .chart-wrap{background:var(--surface);border:1px solid var(--line);padding:16px;margin-bottom:18px;position:relative;height:260px;}
  .measure-entry{
    display:flex;flex-wrap:wrap;gap:16px;font-family:var(--font-mono);font-size:12px;
    color:var(--ink-muted);padding:12px 0;border-bottom:1px solid var(--line);align-items:center;
  }
  .measure-entry .m-date{color:var(--steel);font-weight:700;min-width:90px;}
  .measure-entry .m-val{color:var(--ink);}
  .autosave-tag{font-family:var(--font-mono);font-size:10px;color:var(--success);text-transform:uppercase;letter-spacing:1px;opacity:0;transition:opacity .3s;}
  .autosave-tag.show{opacity:1;}
  .loading{text-align:center;padding:80px 20px;font-family:var(--font-mono);color:var(--ink-muted);}
  .pr-note{font-family:var(--font-mono);font-size:11px;color:var(--rust);margin-top:8px;}
  ::placeholder{color:var(--ink-faint);}
  select option{background:var(--bg);}
</style>
</head>
<body>
<div id="app"><div class="loading">Caricamento diario…</div></div>

<script>
const STORAGE_KEYS = { workouts:'workouts', plan:'trainingPlan', diet:'dietPlan', progress:'progressEntries', photosIndex:'progressPhotosIndex' };
const DAYS = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MEAL_SLOTS = ['Colazione','Spuntino mattina','Pranzo','Spuntino pomeriggio','Cena'];

const FOOD_DB = {

  'tonno al naturale':116, 'uova intere':155, 'albume d\'uovo':52, 'yogurt greco':59,
  'yogurt greco 0%':57, 'ricotta':174, 'parmigiano':392, 'mozzarella':280,
  'latte parzialmente scremato':46, 'pasta cruda':353, 'riso crudo':332,
  'pane integrale':247, 'pane bianco':265, 'patate':77, 'avena':389, 'banana':89,
  'mela':52, 'arancia':47, 'fragole':32, 'mandorle':579, 'noci':654, 'olio d\'oliva':884,
  'fagioli':127, 'ceci':164, 'lenticchie':116, 'broccoli':34, 'spinaci':23,
  'insalata verde':15, 'pomodoro':18, 'carote':41, 'zucchine':17, 'bresaola':151,
  'prosciutto crudo':268, 'prosciutto cotto':145, 'tofu':76, 'quinoa cruda':368,
  'miele':304, 'cioccolato fondente':546, 'proteine in polvere whey':380, 'gelato':207,
  'pizza margherita':266, 'salmone affumicato':117, 'gamberi':99, 'merluzzo':82,
  'cotoletta di pollo panata':250
};
function findFoodKcalPer100g(name){
  const key = (name||'').trim().toLowerCase();
  if(FOOD_DB[key]!==undefined) return FOOD_DB[key];
  const match = Object.keys(FOOD_DB).find(k=> k===key || k.startsWith(key) && key.length>3);
  return match ? FOOD_DB[match] : null;
}

const MOTIVATIONAL_QUOTES = [
  "La costanza batte la motivazione, ogni singola volta.",
  "Non conta l'allenamento perfetto, conta quello fatto.",
  "Il corpo che vuoi si costruisce nei giorni in cui non ne hai voglia.",
  "Ogni serie in più è un investimento che nessuno può portarti via.",
  "Il progresso è silenzioso: si vede dopo, non durante.",
  "Oggi basta essere un po' meglio di ieri, non perfetti.",
  "La disciplina è scegliere tra quello che vuoi ora e quello che vuoi davvero.",
  "Chi si allena quando è stanco, cresce più di chi si allena quando è motivato.",
  "Un allenamento saltato non si recupera mai davvero: si va avanti.",
  "Il peso sulla barra conta meno della costanza con cui torni.",
  "Nessun cambiamento è arrivato da una settimana perfetta, ma da mesi imperfetti fatti bene.",
  "La forma fisica è un lavoro part-time che dura tutta la vita.",
  "Meglio venti minuti fatti che l'ora perfetta rimandata.",
  "Il corpo si adatta a quello che gli chiedi con costanza, non a quello che desideri.",
  "Ogni PR di oggi è nato da un giorno qualunque di qualche mese fa.",
  "Non serve sentirsi pronti, serve iniziare comunque.",
  "L'unico allenamento che non funziona è quello che non fai.",
  "Il recupero fa parte dell'allenamento tanto quanto lo sforzo.",
  "Piccoli progressi ripetuti battono grandi sforzi occasionali.",
  "Sei più vicino all'obiettivo di ieri, anche se oggi non lo senti.",
  "La disciplina che nessuno vede è quella che costruisce i risultati che tutti notano.",
  "Non paragonarti a chi ha iniziato prima di te: paragonati a chi eri un mese fa.",
  "Un pasto equilibrato in più conta più di una dieta perfetta mai iniziata.",
  "La versione migliore di te si allena anche quando non ne ha voglia.",
  "Ogni chilo spostato con criterio è un mattone, non un miracolo.",
  "Non esiste il giorno giusto per iniziare, esiste solo oggi.",
  "Il corpo ricorda ogni allenamento, anche quelli mediocri fatti con costanza.",

];

function getDailyQuote(){
  const now = new Date();
  const startOfYear = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - startOfYear) / 86400000);
  return MOTIVATIONAL_QUOTES[dayOfYear % MOTIVATIONAL_QUOTES.length];
}

let state = { workouts: [], plan: {}, diet: {}, progress: [], photos: [] };
let photoDataCache = {};
let activeTab = 'diario';
let activePlanDay = DAYS[0];
let activeDietDay = DAYS[0];
let showWorkoutForm = false;
let workoutFormExercises = [];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function defaultPlan(){
  const giornoA = [
    {name:'Leg press', sets:'3', reps:'10-12', weight:''},
    {name:'Panca piana', sets:'3', reps:'8-10', weight:''},
    {name:'Lat machine (presa larga)', sets:'3', reps:'10-12', weight:''},
    {name:'Shoulder press', sets:'3', reps:'10-12', weight:''},
    {name:'Leg curl', sets:'3', reps:'12', weight:''},
    {name:'Plank', sets:'3', reps:'30-45 sec', weight:''}
  ];
  const giornoB = [
    {name:'Squat', sets:'3', reps:'10-12', weight:''},
    {name:'Chest press', sets:'3', reps:'10-12', weight:''},
    {name:'Seated row', sets:'3', reps:'10-12', weight:''},
    {name:'Alzate laterali', sets:'3', reps:'12-15', weight:''},
    {name:'Leg extension', sets:'3', reps:'12', weight:''},
    {name:'Crunch su cavo/macchina', sets:'3', reps:'15', weight:''}
  ];
  const plan = Object.fromEntries(DAYS.map(d=>[d,[]]));
  plan['Lunedì'] = giornoA.map(e=>({...e}));
  plan['Mercoledì'] = giornoB.map(e=>({...e}));
  plan['Venerdì'] = giornoA.map(e=>({...e}));
  return plan;
}

function defaultDiet(){
  const dayMeals = ()=>({
    'Colazione': [{food:'Yogurt greco + avena + frutta + frutta secca', qty:'', kcal:500}],
    'Spuntino mattina': [{food:'Frutta + fonte proteica (yogurt o mandorle)', qty:'', kcal:250}],
    'Pranzo': [{food:'Pranzo dal padre: proteine + carboidrati + insalata cruda', qty:'', kcal:750}],
    'Spuntino pomeriggio': [{food:'Proteine in polvere + banana, oppure pane e affettato magro', qty:'', kcal:300}],
    'Cena': [{food:'Proteina abbondante + carboidrati + insalata cruda (stima se meno controllabile)', qty:'', kcal:1150}],
    'integratori': []
  });
  return Object.fromEntries(DAYS.map(d=>[d, dayMeals()]));
}

async function loadAll(){
  let seedPlan = false, seedDiet = false;
  try{
    const w = localStorage.getItem(STORAGE_KEYS.workouts);
    const p = localStorage.getItem(STORAGE_KEYS.plan);
    const d = localStorage.getItem(STORAGE_KEYS.diet);
    const pr = localStorage.getItem(STORAGE_KEYS.progress);
    const ph = localStorage.getItem(STORAGE_KEYS.photosIndex);
    state.workouts = w ? JSON.parse(w) : [];
    if(p){ state.plan = JSON.parse(p); } else { state.plan = defaultPlan(); seedPlan = true; }
    if(d){ state.diet = JSON.parse(d); } else { state.diet = defaultDiet(); seedDiet = true; }
    state.progress = pr ? JSON.parse(pr) : [];
    state.photos = ph ? JSON.parse(ph) : [];
    DAYS.forEach(day=>{
      if(!state.plan[day]) state.plan[day] = [];
      if(!state.diet[day]) state.diet[day] = Object.fromEntries(MEAL_SLOTS.map(s=>[s,[]]));
      MEAL_SLOTS.forEach(s=>{ if(!state.diet[day][s]) state.diet[day][s]=[]; });
      if(!state.diet[day].integratori) state.diet[day].integratori = [];
    });
  }catch(e){
    console.error('Errore caricamento dati', e);
    state.plan = defaultPlan();
    state.diet = defaultDiet();
  }
  render();
  if(seedPlan) savePlan();
  if(seedDiet) saveDiet();
}

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('ghisaDB', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('photos', {keyPath:'id'}); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSetPhoto(id, dataUrl){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('photos','readwrite');
    tx.objectStore('photos').put({id, dataUrl});
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetPhoto(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('photos','readonly');
    const req = tx.objectStore('photos').get(id);
    req.onsuccess = ()=>resolve(req.result ? req.result.dataUrl : null);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbDeletePhoto(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('photos','readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}

function saveKey(key, data, tagId){
  try{
    localStorage.setItem(key, JSON.stringify(data));
    hideSaveError();
    if(tagId){
      const tag = document.getElementById(tagId);
      if(tag){ tag.classList.add('show'); setTimeout(()=>tag.classList.remove('show'), 1200); }
    }
  }catch(e){
    console.error('Errore salvataggio', key, e);
    showSaveError(key, ()=>saveKey(key, data, tagId));
  }
}

function showSaveError(key, retryFn){
  let banner = document.getElementById('save-error-banner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'save-error-banner';
    banner.style.cssText = 'position:sticky;top:0;z-index:10;background:var(--rust-dim);color:#F6EFE7;font-family:var(--font-mono);font-size:12px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;';
    document.getElementById('app').prepend(banner);
  }
  banner.innerHTML = `<span>Salvataggio non riuscito (${escapeHTML(key)}). Potrebbe essere pieno lo spazio disponibile sul telefono per quest'app.</span>`;
  const retryBtn = document.createElement('button');
  retryBtn.className = 'btn btn-sm';
  retryBtn.style.cssText = 'border-color:#F6EFE7;color:#F6EFE7;flex-shrink:0;';
  retryBtn.textContent = 'Riprova';
  retryBtn.addEventListener('click', retryFn);
  banner.appendChild(retryBtn);
}

function hideSaveError(){
  const banner = document.getElementById('save-error-banner');
  if(banner) banner.remove();
}

function saveWorkouts(){ saveKey(STORAGE_KEYS.workouts, state.workouts); }
function savePlan(tagId){ saveKey(STORAGE_KEYS.plan, state.plan, tagId); }
function saveDiet(tagId){ saveKey(STORAGE_KEYS.diet, state.diet, tagId); }
function saveProgress(){ saveKey(STORAGE_KEYS.progress, state.progress); }
function savePhotosIndex(){ saveKey(STORAGE_KEYS.photosIndex, state.photos); }

function resizeImageToDataURL(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Lettura file fallita'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Immagine non valida'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadProgressPhoto(file, date, note){
  try{
    const dataUrl = await resizeImageToDataURL(file, 900);
    const id = uid();
    await idbSetPhoto(id, dataUrl);
    photoDataCache[id] = dataUrl;
    state.photos.push({id, date, note});
    savePhotosIndex();
    renderProgressi();
  }catch(e){
    console.error('Errore upload foto', e);
    alert('Non sono riuscito a caricare questa foto.');
  }
}

async function deleteProgressPhoto(id){
  try{ await idbDeletePhoto(id); }catch(e){ console.error('Errore eliminazione foto', e); }
  delete photoDataCache[id];
  state.photos = state.photos.filter(p=>p.id!==id);
  savePhotosIndex();
  renderProgressi();
}

async function refreshPhotoGallery(){
  const gallery = document.getElementById('photo-gallery');
  if(!gallery) return;
  const sorted = [...state.photos].sort((a,b)=>b.date.localeCompare(a.date));
  if(sorted.length===0){
    gallery.innerHTML = `<div class="empty-state">Nessuna foto ancora. Carica la prima qui sopra.</div>`;
    return;
  }
  gallery.innerHTML = `<div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);">Caricamento foto…</div>`;
  const missing = sorted.filter(p=>!photoDataCache[p.id]);
  try{
    await Promise.all(missing.map(async p=>{
      try{ const dataUrl = await idbGetPhoto(p.id); if(dataUrl) photoDataCache[p.id] = dataUrl; }
      catch(e){ console.error('Errore caricamento foto', p.id, e); }
    }));
  }catch(e){ console.error(e); }
  gallery.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;">
      ${sorted.map(p=>`
        <div style="position:relative;">
          <img src="${photoDataCache[p.id]||''}" alt="Foto progressi ${formatDateShort(p.date)}" style="width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);display:block;">
          <div class="date-badge" style="position:absolute;top:6px;left:6px;font-size:10px;padding:2px 6px;">${formatDateShort(p.date)}</div>
          <button class="btn btn-ghost btn-sm" data-del-photo="${p.id}" style="position:absolute;top:4px;right:4px;background:rgba(28,27,25,0.7);">✕</button>
          ${p.note? `<p style="font-size:11px;color:var(--ink-muted);margin:6px 0 0;font-family:var(--font-mono);">${escapeHTML(p.note)}</p>`:''}
        </div>
      `).join('')}
    </div>
  `;
  gallery.querySelectorAll('[data-del-photo]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(confirm('Eliminare questa foto?')) deleteProgressPhoto(b.dataset.delPhoto);
    });
  });
}

/* ---------- DIARIO ---------- */
function exerciseMaxWeight(name){
  let max = 0;
  state.workouts.forEach(w=>w.exercises.forEach(ex=>{
    if(ex.name.trim().toLowerCase()===name.trim().toLowerCase()){
      ex.sets.forEach(s=>{ if(s.weight>max) max=s.weight; });
    }
  }));
  return max;
}

function renderDiario(){
  const el = document.getElementById('panel-diario');
  const sorted = [...state.workouts].sort((a,b)=> b.date.localeCompare(a.date));
  el.innerHTML = `
    <h2 class="section-title">Diario allenamenti</h2>
    <p class="section-hint">Registra ogni sessione: esercizi, serie, ripetizioni, peso e calorie bruciate.</p>
    <div style="margin-bottom:16px;">
      <button class="btn btn-primary" id="toggle-workout-form">${showWorkoutForm? 'Annulla' : '+ Nuovo allenamento'}</button>
    </div>
    <div id="workout-form-wrap"></div>
    <div id="workout-list"></div>
  `;
  document.getElementById('toggle-workout-form').addEventListener('click', ()=>{
    showWorkoutForm = !showWorkoutForm;
    if(showWorkoutForm) workoutFormExercises = [{id:uid(), name:'', sets:[{reps:'',weight:''}]}];
    renderDiario();
  });

  if(showWorkoutForm){
    document.getElementById('workout-form-wrap').innerHTML = workoutFormHTML();
    bindWorkoutForm();
  }

  const listEl = document.getElementById('workout-list');
  if(sorted.length===0){
    listEl.innerHTML = `<div class="empty-state">Nessun allenamento registrato ancora.<br>Il primo giorno di scheda inizia da qui.</div>`;
    return;
  }
  listEl.innerHTML = sorted.map(w=>{
    const exercisesHTML = w.exercises.map(ex=>{
      const priorMax = exerciseMaxBeforeWorkout(ex.name, w);
      return `
      <div class="exercise-block">
        <div class="exercise-name">${escapeHTML(ex.name)}</div>
        ${ex.sets.map((s,i)=>{
          const isPR = s.weight > priorMax && s.weight > 0;
          return `<div class="set-row"><span class="set-idx">${i+1}</span><span class="set-val">${s.reps} reps × ${s.weight} kg</span>${isPR?'<span class="stamp">PR</span>':''}</div>`;
        }).join('')}
      </div>`;
    }).join('');
    return `
    <div class="card log-entry">
      <div class="date-badge">${formatDateShort(w.date)}</div>
      <div class="meta">${w.duration? w.duration+' min · ':''}${w.calories? w.calories+' kcal bruciate':'kcal non registrate'}</div>
      ${exercisesHTML}
      ${w.notes? `<div class="divider"></div><div style="font-size:13px;color:var(--ink-muted);">${escapeHTML(w.notes)}</div>`:''}
      <div class="card-actions">
        <button class="btn btn-ghost btn-sm" data-del-workout="${w.id}">Elimina</button>
      </div>
    </div>`;
  }).join('');
  listEl.querySelectorAll('[data-del-workout]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(confirm('Eliminare questo allenamento dal diario?')){
        state.workouts = state.workouts.filter(w=>w.id!==b.dataset.delWorkout);
        saveWorkouts(); renderDiario();
      }
    });
  });
}

function exerciseMaxBeforeWorkout(name, currentWorkout){
  let max = 0;
  state.workouts.forEach(w=>{
    if(w.date > currentWorkout.date || (w.date===currentWorkout.date && w.id===currentWorkout.id)) return;
    w.exercises.forEach(ex=>{
      if(ex.name.trim().toLowerCase()===name.trim().toLowerCase()){
        ex.sets.forEach(s=>{ if(s.weight>max) max=s.weight; });
      }
    });
  });
  return max;
}

function bindWorkoutForm(){
  const wrap = document.getElementById('workout-form-wrap');
  wrap.querySelectorAll('.ex-name-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const ex = workoutFormExercises.find(e=>e.id===inp.dataset.ex);
      if(ex) ex.name = inp.value;
    });
  });
  wrap.querySelectorAll('.set-reps-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const ex = workoutFormExercises.find(e=>e.id===inp.dataset.ex);
      if(ex) ex.sets[+inp.dataset.idx].reps = inp.value;
    });
  });
  wrap.querySelectorAll('.set-weight-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const ex = workoutFormExercises.find(e=>e.id===inp.dataset.ex);
      if(ex) ex.sets[+inp.dataset.idx].weight = inp.value;
    });
  });
  wrap.querySelectorAll('[data-add-set]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const ex = workoutFormExercises.find(e=>e.id===b.dataset.addSet);
      if(ex){ ex.sets.push({reps:'',weight:''}); renderDiario(); }
    });
  });
  wrap.querySelectorAll('[data-remove-set]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const [exId, idx] = b.dataset.removeSet.split(':');
      const ex = workoutFormExercises.find(e=>e.id===exId);
      if(ex && ex.sets.length>1){ ex.sets.splice(+idx,1); renderDiario(); }
    });
  });
  wrap.querySelectorAll('[data-remove-ex]').forEach(b=>{
    b.addEventListener('click', ()=>{
      workoutFormExercises = workoutFormExercises.filter(e=>e.id!==b.dataset.removeEx);
      if(workoutFormExercises.length===0) workoutFormExercises.push({id:uid(),name:'',sets:[{reps:'',weight:''}]});
      renderDiario();
    });
  });
  const addExBtn = document.getElementById('wf-add-exercise');
  if(addExBtn) addExBtn.addEventListener('click', ()=>{
    workoutFormExercises.push({id:uid(), name:'', sets:[{reps:'',weight:''}]});
    renderDiario();
  });
  const saveBtn = document.getElementById('wf-save');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const date = document.getElementById('wf-date').value || new Date().toISOString().slice(0,10);
    const duration = document.getElementById('wf-duration').value;
    const calories = document.getElementById('wf-calories').value;
    const notes = document.getElementById('wf-notes').value;
    const exercises = workoutFormExercises
      .filter(e=>e.name.trim())
      .map(e=>({ name:e.name.trim(), sets: e.sets.filter(s=>s.reps!=='' || s.weight!=='').map(s=>({reps:+s.reps||0, weight:+s.weight||0})) }));
    if(exercises.length===0){ alert('Aggiungi almeno un esercizio con nome.'); return; }
    state.workouts.push({ id:uid(), date, duration:+duration||0, calories:+calories||0, notes, exercises });
    saveWorkouts();
    showWorkoutForm = false;
    renderDiario();
  });
}

        const per100 = findFoodKcalPer100g(food);
        const grams = parseFloat(qty);
        if(per100!==null && !isNaN(grams) && grams>0) kcal = Math.round(per100*grams/100);
      }
      state.diet[activeDietDay][slot].push({food, qty, kcal:+kcal||0});
      saveDiet('diet-autosave'); renderDieta();
    });
  });
}

/* ---------- PROGRESSI ---------- */
function renderProgressi(){
  const el = document.getElementById('panel-progressi');
  const sorted = [...state.progress].sort((a,b)=>a.date.localeCompare(b.date));
  const last = sorted[sorted.length-1];
  const first = sorted[0];
  const weightDelta = (last && first && sorted.length>1) ? (last.weight - first.weight) : null;

  el.innerHTML = `
    <h2 class="section-title">Progressi</h2>
    <p class="section-hint">Peso, misure e composizione corporea nel tempo.</p>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Peso attuale</div><div class="value">${last? last.weight+' kg' : '—'}</div></div>
      <div class="stat-card"><div class="label">Variazione totale</div><div class="value ${weightDelta>0?'up':weightDelta<0?'down':''}">${weightDelta!==null? (weightDelta>0?'+':'')+weightDelta.toFixed(1)+' kg' : '—'}</div></div>
      <div class="stat-card"><div class="label">Massa grassa</div><div class="value">${last && last.bodyFat? last.bodyFat+'%':'—'}</div></div>
      <div class="stat-card"><div class="label">Voci registrate</div><div class="value">${state.progress.length}</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <span style="font-family:var(--font-display);font-size:16px;">Nuova rilevazione</span>
      </div>
      <div class="row">
        <div class="field"><label class="field-label">Data</label><input type="date" id="pf-date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label class="field-label">Peso (kg)</label><input type="number" id="pf-weight" step="0.1" placeholder="75.5"></div>
        <div class="field"><label class="field-label">Massa grassa (%)</label><input type="number" id="pf-bodyfat" step="0.1" placeholder="18.0"></div>
      </div>
      <div class="row">
        <div class="field"><label class="field-label">Petto (cm)</label><input type="number" id="pf-chest" step="0.5"></div>
        <div class="field"><label class="field-label">Vita (cm)</label><input type="number" id="pf-waist" step="0.5"></div>
        <div class="field"><label class="field-label">Fianchi (cm)</label><input type="number" id="pf-hips" step="0.5"></div>
      </div>
      <div class="row">
        <div class="field"><label class="field-label">Braccio (cm)</label><input type="number" id="pf-arm" step="0.5"></div>
        <div class="field"><label class="field-label">Coscia (cm)</label><input type="number" id="pf-thigh" step="0.5"></div>
        <div class="field"><label class="field-label">Note</label><input type="text" id="pf-notes" placeholder="opzionale"></div>
      </div>
      <div class="card-actions">
        <button class="btn btn-primary" id="pf-save">Registra</button>
      </div>
    </div>
    <div class="chart-wrap"><div id="weight-chart" style="width:100%;height:100%;"></div></div>
    <div class="chart-wrap"><div id="bf-chart" style="width:100%;height:100%;"></div></div>
    <h2 class="section-title" style="margin-top:28px;">Foto progressi</h2>
    <p class="section-hint">Carica una foto ogni settimana o ogni mese per vedere i cambiamenti nel tempo.</p>
    <div class="card">
      <div class="row">
        <div class="field"><label class="field-label">Data</label><input type="date" id="photo-date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="field"><label class="field-label">Nota (opzionale)</label><input type="text" id="photo-note" placeholder="es. dopo 4 settimane"></div>
      </div>
      <div class="field"><label class="field-label">Foto</label><input type="file" id="photo-file" accept="image/*"></div>
      <div class="card-actions">
        <button class="btn btn-primary" id="photo-upload-btn">Carica foto</button>
      </div>
    </div>
    <div id="photo-gallery" style="margin-bottom:24px;"></div>
    <h2 class="section-title" style="margin-top:28px;">Storico</h2>
    <div id="progress-history"></div>
  `;

  document.getElementById('pf-save').addEventListener('click', ()=>{
    const date = document.getElementById('pf-date').value;
    const weight = +document.getElementById('pf-weight').value;
    if(!date || !weight){ alert('Data e peso sono obbligatori.'); return; }
    const entry = {
      id: uid(), date, weight,
      bodyFat: +document.getElementById('pf-bodyfat').value || null,
      measurements: {
        petto: +document.getElementById('pf-chest').value || null,
        vita: +document.getElementById('pf-waist').value || null,
        fianchi: +document.getElementById('pf-hips').value || null,
        braccio: +document.getElementById('pf-arm').value || null,
        coscia: +document.getElementById('pf-thigh').value || null,
      },
      notes: document.getElementById('pf-notes').value
    };
    state.progress.push(entry);
    saveProgress();
    renderProgressi();
  });

  const historyEl = document.getElementById('progress-history');
  const historyDesc = [...state.progress].sort((a,b)=>b.date.localeCompare(a.date));
  historyEl.innerHTML = historyDesc.length ? historyDesc.map(e=>{
    const m = e.measurements || {};
    const parts = [];
    if(m.petto) parts.push(`petto ${m.petto}`);
    if(m.vita) parts.push(`vita ${m.vita}`);
    if(m.fianchi) parts.push(`fianchi ${m.fianchi}`);
    if(m.braccio) parts.push(`braccio ${m.braccio}`);
    if(m.coscia) parts.push(`coscia ${m.coscia}`);
    return `<div class="measure-entry">
      <span class="m-date">${formatDateShort(e.date)}</span>
      <span class="m-val">${e.weight} kg</span>
      ${e.bodyFat? `<span class="m-val">${e.bodyFat}% bf</span>`:''}
      ${parts.length? `<span class="m-val">${parts.join(' · ')}</span>`:''}
      <button class="btn btn-ghost btn-sm" data-del-progress="${e.id}" style="margin-left:auto;">✕</button>
    </div>`;
  }).join('') : `<div class="empty-state">Nessuna rilevazione ancora. Registra la prima misura qui sopra.</div>`;
  historyEl.querySelectorAll('[data-del-progress]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.progress = state.progress.filter(e=>e.id!==b.dataset.delProgress);
      saveProgress(); renderProgressi();
    });
  });

  document.getElementById('photo-upload-btn').addEventListener('click', ()=>{
    const fileInp = document.getElementById('photo-file');
    const date = document.getElementById('photo-date').value || new Date().toISOString().slice(0,10);
    const note = document.getElementById('photo-note').value.trim();
    if(!fileInp.files || fileInp.files.length===0){ alert('Seleziona prima una foto.'); return; }
    uploadProgressPhoto(fileInp.files[0], date, note);
  });
  refreshPhotoGallery();

  renderCharts(sorted);
}

function svgLineChart(data, color, title){
  if(data.length===0){
    return `<div class="empty-state" style="height:100%;display:flex;align-items:center;justify-content:center;">${escapeHTML(title)} — nessun dato ancora.</div>`;
  }
  const w=640, h=220, padL=40, padR=16, padT=24, padB=28;
  const values = data.map(d=>d.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const spanMin = range<1 ? min-1 : min, spanMax = range<1 ? max+1 : max;
  const spanRange = spanMax-spanMin;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const stepX = data.length>1 ? innerW/(data.length-1) : 0;
  const pts = data.map((d,i)=>{
    const x = padL + i*stepX;
    const y = padT + innerH - ((d.value-spanMin)/spanRange)*innerH;
    return [x,y];
  });
  const pathD = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1][0].toFixed(1)},${(padT+innerH).toFixed(1)} L${pts[0][0].toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
  const labelEvery = Math.max(1, Math.ceil(data.length/6));
  const xLabels = pts.map((p,i)=> i%labelEvery===0 || i===pts.length-1 ? `<text x="${p[0].toFixed(1)}" y="${h-8}" font-size="9" fill="#948C7C" font-family="'JetBrains Mono',monospace" text-anchor="middle">${escapeHTML(data[i].label)}</text>` : '').join('');
  const circles = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const yTop = `<text x="4" y="${padT+4}" font-size="9" fill="#948C7C" font-family="'JetBrains Mono',monospace">${spanMax.toFixed(1)}</text>`;
  const yBot = `<text x="4" y="${padT+innerH}" font-size="9" fill="#948C7C" font-family="'JetBrains Mono',monospace">${spanMin.toFixed(1)}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;">
    <text x="${padL}" y="14" font-size="11" fill="#ECE7DD" font-family="'JetBrains Mono',monospace" font-weight="700">${escapeHTML(title)}</text>
    <line x1="${padL}" y1="${padT+innerH}" x2="${padL+innerW}" y2="${padT+innerH}" stroke="#3A362F" stroke-width="1"/>
    <path d="${areaD}" fill="${color}22" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2"/>
    ${circles}
    ${xLabels}
    ${yTop}${yBot}
  </svg>`;
}

function renderCharts(sorted){
  const weightEl = document.getElementById('weight-chart');
  const bfEl = document.getElementById('bf-chart');
  const weightData = sorted.map(e=>({label:formatDateShort(e.date), value:e.weight}));
  weightEl.parentElement.innerHTML = svgLineChart(weightData, '#C1421A', 'Peso (kg)');
  const bfData = sorted.filter(e=>e.bodyFat).map(e=>({label:formatDateShort(e.date), value:e.bodyFat}));
  document.getElementById('bf-chart') ? null : null;
  const bfWrap = weightEl.parentElement.nextElementSibling;
  bfWrap.innerHTML = svgLineChart(bfData, '#7C8A5E', 'Massa grassa (%)');
}

/* ---------- utils ---------- */
function formatDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'2-digit'});
}
function formatDateLong(d){
  return d.toLocaleDateString('it-IT', {weekday:'long', day:'2-digit', month:'long'}).toUpperCase();
}
function escapeHTML(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHTML(s); }

loadAll();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>console.error('SW registration failed', e));
  });
}
